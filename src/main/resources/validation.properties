# バリデーション
jakarta.validation.constraints.NotNull.message={0}が未入力です
jakarta.validation.constraints.DecimalMin.message={0}は{value}以上で入力して下さい
jakarta.validation.constraints.DecimalMax.message={0}は{value}未満で入力して下さい
jakarta.validation.constraints.Digits.message={0}は整数{integer}桁、小数{fraction}桁以内で入力して下さい
typeMismatch.java.math.BigDecimal={0}は数値で入力して下さい
jakarta.validation.constraints.Size.message={0}は{max}以内で入力して下さい

weightGoal.date.order=開始日が終了日よりも後に指定されています
weightGoal.date.duplicate=指定の期間は既存の目標と重複しています

# 項目名
weightDt=日付
weight=体重
fat=体脂肪率
memo=メモ

stDt=開始日
edDt=終了日
weightGoal=目標体重