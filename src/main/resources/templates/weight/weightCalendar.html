<div id="weightCalendarPage" class="calendar-content">
    <div class="calendar-box">
        <div id="weightCalendar"></div>
    </div>
</div>

<div id="weightModal" class="modal fade">
    <div class="modal-dialog modal-dialog-centered">
        <form id="weightForm" th:action="@{/weight/weightModal/save}" method="post" th:object="${weight}" class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">体重入力</h5>
                <button type="button" class="btn-close modal-btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="weightMessage" class="d-none">
                    <div id="weightStatus" class="alert"></div>
                </div>
                <div class="modal-date">
                    <input type="date" th:field="*{weightDt}" />
                </div>
                <div class="modal-weight">
                    <div class="modal-input-weight">
                        <label for="weight">体重</label>
                        <input type="number" th:field="*{weight}" step="0.1" /><span>kg</span>
                    </div>
                    <div class="modal-input-weight">
                        <label for="fat">体脂肪率</label>
                        <input type="number" th:field="*{fat}" step="0.1" /><span>%</span>
                    </div>
                </div>
                <div class="modal-memo">
                    <label for="memo">メモ</label>
                    <textarea th:field="*{memo}" rows="5" maxlength="200"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">キャンセル</button>
                <button type="submit" class="btn btn-primary">登録</button>
            </div>
        </form>
    </div>
</div>
