spring.application.name=MyDiet

# データベース接続設定
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/mydietdb?useUnicode=true&ch
aracterEncoding=utf8&serverTimezone=Asia/Tokyo
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD}

# MyBatis の設定
mybatis.mapper-locations=classpath*:/mybatis/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.type-aliases-package=com.example.app.domain